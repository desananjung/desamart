name: Deploy to Production

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Test Backend
        run: |
          cd backend
          npm ci
          npm test
          
      - name: Test Frontend
        run: |
          cd frontend
          npm ci
          npm test

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build Backend Image
        run: |
          docker build -f backend/Dockerfile.prod -t ${{ secrets.DOCKER_USERNAME }}/desamart-backend:latest ./backend
          
      - name: Build Frontend Image
        run: |
          docker build -f frontend/Dockerfile.prod -t ${{ secrets.DOCKER_USERNAME }}/desamart-frontend:latest ./frontend
          
      - name: Push Images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/desamart-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/desamart-frontend:latest
          
      - name: Deploy to Server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/desamart
            docker-compose -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.prod.yml up -d
            docker system prune -f

  backup:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Backup Database
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/desamart
            ./scripts/backup.sh